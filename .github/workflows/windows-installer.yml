name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Fetch pinned Git / Node / Python
        run: node scripts/fetch-vendors.js

      - name: Build LoopForge Windows binaries
        run: node scripts/build-loopforge-bins.js --skip-hash-verify

      - name: Install npm dependencies
        run: npm ci

      - name: Build unsigned NSIS installer
        env:
          # Unsigned by default. Set repository secrets CSC_LINK and
          # CSC_KEY_PASSWORD to enable Authenticode signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoopForge-Setup
          if-no-files-found: error
          path: |
            dist/LoopForge-Setup-*.exe
            dist/LoopForge-Setup-*.exe.blockmap
            dist/latest.yml
