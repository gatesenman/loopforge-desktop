name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Fetch pinned Git / Node / Python
        run: node scripts/fetch-vendors.js

      - name: Build LoopForge Windows binaries
        run: npm run build-bins

      - name: Install npm dependencies
        run: npm ci

      - name: Unit security tests
        run: npm test

      - name: Native Windows runtime smoke (paths containing spaces, no GUI)
        run: npm run smoke:windows

      - name: Build unsigned NSIS installer
        env:
          # Unsigned by default. Set repository secrets CSC_LINK and
          # CSC_KEY_PASSWORD to enable Authenticode signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Installed Windows Electron GUI acceptance (synthetic data, no provider)
        timeout-minutes: 15
        run: node tests/windows/installed-e2e.cjs

      - name: Upload GUI acceptance evidence (no raw logs, credentials or databases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installed-GUI-evidence
          if-no-files-found: warn
          path: .e2e-evidence/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoopForge-Setup
          if-no-files-found: error
          path: |
            dist/LoopForge-Setup-*.exe
            dist/LoopForge-Setup-*.exe.blockmap
            dist/latest.yml
            resources/bin/build-manifest.json
            .smoke/result.json
