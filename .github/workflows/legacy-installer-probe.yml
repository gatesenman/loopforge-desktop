name: Legacy installer native diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe published 0.4.0 installer (no real data)
        run: ./tests/windows/legacy-installer-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Legacy-installer-${{ matrix.os }}
          include-hidden-files: true
          path: .legacy-installer-evidence/
